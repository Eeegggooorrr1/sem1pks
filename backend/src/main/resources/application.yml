spring:
  application:
    name: sem1pks
  datasource:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
app:
  jwt:
    access-secret: ${APP_JWT_ACCESS_SECRET}
    access-expiration-milliseconds: ${APP_JWT_ACCESS_EXPIRATION_MILLISECONDS}
  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED}
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD}
    demo-enabled: ${BOOTSTRAP_DEMO_ENABLED}
    demo-password: ${BOOTSTRAP_DEMO_PASSWORD}
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
logging:
  level:
    root: INFO
    dasein.sem1pks: INFO
---
spring:
  config:
    activate:
      on-profile: jdbc
  autoconfigure:
    exclude:
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
