spring:
  application:
    name: sem1pks

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    access-secret: ${APP_JWT_ACCESS_SECRET}
    access-expiration-milliseconds: ${APP_JWT_ACCESS_EXPIRATION_MILLISECONDS}


server:
  port: 8080
